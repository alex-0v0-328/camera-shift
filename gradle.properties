org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Built against the oldest NeoForge in use (the guzhenren dev client), so the compiler proves no newer API
# is used; the mods.toml range derived from it stays open-ended for newer modpacks.
neo_version=21.1.238
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

mod_id=camerashift
mod_name=Camera Shift
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=net.alex.camerashift

# Epic Fight from the Modrinth maven; the range is what the mod accepts at load time
epicfight_version=21.17.3.1-mc1.21.1-neoforge
epicfight_version_range=[21.17.3.1,)

junit_version=5.10.2
